spring:
  application:
    name: ms-notifications
  profiles:
    active: dev
  datasource:
    url: ${MS_NOTIFICATIONS_DB_URL:jdbc:postgresql://${MS_NOTIFICATIONS_DB_HOST:localhost}:${MS_NOTIFICATIONS_DB_PORT:5432}/${MS_NOTIFICATIONS_DB_NAME:catastrofecl}}
    username: ${MS_NOTIFICATIONS_DB_USER:postgres}
    password: ${MS_NOTIFICATIONS_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    table: flyway_schema_history_ms_notifications
    validate-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8086

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

catastrofescl:
  rabbitmq:
    exchange-topic: catastrofescl.events
    exchange-dlx: catastrofescl.dlx
    cola-notificaciones: notifications.queue
    cola-email: email.queue
    consumidor-nombre: ms-notifications
  auth:
    dev-mode: false
    dev-trust-gateway-firebase-headers: false
    dev-default-role-for-gateway: AUTORIDAD
    public-paths:
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /ws-notificaciones/**
